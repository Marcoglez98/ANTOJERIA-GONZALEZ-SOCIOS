name: Generar APK ANTOJERIA GONZALEZ SOCIOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          java -version

      - name: Crear estructura Android
        run: |
          flutter create --platforms=android --org com.antojeria.gonzalez .

      - name: Configurar package Android SOCIOS
        run: |
          sed -i 's/applicationId = "com.antojeria.gonzalez.antojitos_pos"/applicationId = "com.antojeria.gonzalez.socios"/g' android/app/build.gradle.kts || true
          sed -i 's/applicationId = "com.antojeria.gonzalez.antojeria_gonzalez_socios"/applicationId = "com.antojeria.gonzalez.socios"/g' android/app/build.gradle.kts || true
          sed -i 's/applicationId = "com.antojeria.gonzalez.antojitosPos"/applicationId = "com.antojeria.gonzalez.socios"/g' android/app/build.gradle.kts || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar proyecto
        run: flutter analyze

      - name: Compilar APK
        run: flutter build apk --release

      - name: Preparar APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/ANTOJERIA-GONZALEZ-SOCIOS.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ANTOJERIA-GONZALEZ-SOCIOS-APK
          path: release/ANTOJERIA-GONZALEZ-SOCIOS.apk
